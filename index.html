
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wakeel AI | Intelligent Workforce</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', 'IBM Plex Sans Arabic', sans-serif;
        background-color: #000000;
        color: #e4e4e7;
        overflow-x: hidden;
        cursor: none; /* Hide default cursor */
      }
      
      .font-mono {
        font-family: 'Space Mono', 'IBM Plex Sans Arabic', monospace;
      }

      /* --- Professional Glowing Cursor --- */
      .custom-cursor {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 10000;
        pointer-events: none;
        will-change: transform;
        /* Default visible, hidden on mobile via media query */
        display: block; 
        mix-blend-mode: screen;
      }

      .cursor-svg {
        width: 45px;  /* Significantly Larger */
        height: 45px; /* Significantly Larger */
        fill: rgba(99, 102, 241, 0.2); /* Indigo-500 with transparency for body */
        stroke: #818cf8; /* Lighter Indigo Stroke */
        stroke-width: 1.5px;
        /* Enhanced Glow Effect */
        filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.6)) drop-shadow(0 0 20px rgba(168, 85, 247, 0.4));
        transition: transform 0.1s ease-out; /* Faster scale transition */
      }

      /* Hover State: Sharper and slightly smaller for precision feel */
      body:active .cursor-svg {
        transform: scale(0.9);
        fill: rgba(99, 102, 241, 0.4);
      }

      /* --- Scroll Animations --- */
      
      /* Base Class for Reveal */
      .reveal-on-scroll {
        opacity: 0;
        transition: all 1s cubic-bezier(0.16, 1, 0.3, 1); /* Elegant easing */
        will-change: opacity, transform;
      }

      /* Fade Up - Default */
      .reveal-on-scroll.fade-up {
        transform: translateY(40px);
      }
      .reveal-on-scroll.fade-up.is-visible {
        opacity: 1;
        transform: translateY(0);
      }

      /* Slide Side (Left/Right based on Direction) */
      html[dir="ltr"] .reveal-on-scroll.slide-in-right { transform: translateX(50px); }
      html[dir="rtl"] .reveal-on-scroll.slide-in-right { transform: translateX(-50px); }
      
      html[dir="ltr"] .reveal-on-scroll.slide-in-left { transform: translateX(-50px); }
      html[dir="rtl"] .reveal-on-scroll.slide-in-left { transform: translateX(50px); }

      .reveal-on-scroll.slide-in-right.is-visible,
      .reveal-on-scroll.slide-in-left.is-visible {
        opacity: 1;
        transform: translateX(0);
      }

      /* Zoom In */
      .reveal-on-scroll.zoom-in {
        transform: scale(0.95);
      }
      .reveal-on-scroll.zoom-in.is-visible {
        opacity: 1;
        transform: scale(1);
      }

      /* Stagger Delays */
      .delay-100 { transition-delay: 100ms; }
      .delay-200 { transition-delay: 200ms; }
      .delay-300 { transition-delay: 300ms; }
      .delay-500 { transition-delay: 500ms; }

      /* --- Mobile Specific Strong Animations --- */
      @media (max-width: 768px) {
        .custom-cursor {
          display: none; /* Hide custom cursor on touch devices */
        }
        body {
            cursor: auto; /* Restore default touch behavior */
        }

        /* Stronger Vertical Movement on Mobile */
        .reveal-on-scroll.fade-up {
            transform: translateY(80px) scale(0.9); /* Deep slide + Scale down */
        }
        .reveal-on-scroll.fade-up.is-visible {
            transform: translateY(0) scale(1);
        }
        
        /* Faster, punchier transition on mobile */
        .reveal-on-scroll {
            transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); 
        }
      }

      /* --- End Scroll Animations --- */
      
      /* Animations for Hero Section - CRITICAL FIX */
      @keyframes fade-in-up {
        0% { opacity: 0; transform: translateY(30px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      
      @keyframes fade-in-down {
        0% { opacity: 0; transform: translateY(-30px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      
      .animate-fade-in-up {
        animation: fade-in-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      
      .animate-fade-in-down {
        animation: fade-in-down 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        background: #09090b;
      }
      ::-webkit-scrollbar-thumb {
        background: #3f3f46; 
        border-radius: 4px;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.32.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0"
  }
}
</script>
</head>
  <body class="bg-black text-zinc-100 antialiased selection:bg-indigo-500/30 selection:text-white">
    <!-- SVG Custom Cursor -->
    <div id="custom-cursor" class="custom-cursor">
      <svg class="cursor-svg" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
        <!-- Abstract Large Arrow Shape: "The Stealth Shard" -->
        <!-- Points to top-left (0,0) accurately -->
        <path d="M0 0 L36 12 L20 20 L12 36 L0 0 Z" stroke-linejoin="round" />
      </svg>
    </div>
    
    <div id="root"></div>

    <script>
        // Advanced Cursor Logic
        const cursor = document.getElementById("custom-cursor");
        
        // State for smooth interpolation
        let mouseX = -100; // Start off screen
        let mouseY = -100;
        let cursorX = -100;
        let cursorY = -100;

        document.addEventListener("mousemove", (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function animateCursor() {
            // Smooth lerp (Linear Interpolation) for professional feel
            // Speed factor: 0.35 -> Higher is faster/easier to move, Lower is heavier/smoother.
            // 0.35 provides a very responsive "gaming mouse" feel while keeping it smooth.
            const speed = 0.35; 
            
            cursorX += (mouseX - cursorX) * speed;
            cursorY += (mouseY - cursorY) * speed;

            if (cursor) {
                // No offset needed as the SVG path starts at 0,0
                // Use translate3d for GPU acceleration
                cursor.style.transform = `translate3d(${cursorX}px, ${cursorY}px, 0)`;
            }

            requestAnimationFrame(animateCursor);
        }

        // Start animation loop
        animateCursor();

        // Advanced Scroll Reveal Logic
        document.addEventListener('DOMContentLoaded', () => {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-visible');
                    }
                });
            }, {
                threshold: 0.1, // Trigger earlier on mobile
                rootMargin: "0px 0px -10% 0px" // Trigger before hitting exact bottom
            });

            // Target elements added by React
            const checkForElements = setInterval(() => {
                const elements = document.querySelectorAll('.reveal-on-scroll:not(.observed)');
                elements.forEach(el => {
                    observer.observe(el);
                    el.classList.add('observed');
                });
            }, 500);
        });
    </script>
  </body>
</html>
