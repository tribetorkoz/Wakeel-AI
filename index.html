
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wakeel AI | Intelligent Workforce</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', 'IBM Plex Sans Arabic', sans-serif;
        background-color: #000000;
        color: #e4e4e7;
        overflow-x: hidden;
        cursor: none; /* Hide default cursor */
      }
      
      .font-mono {
        font-family: 'Space Mono', 'IBM Plex Sans Arabic', monospace;
      }

      /* Custom Cursor */
      .cursor-dot,
      .cursor-outline {
        position: fixed;
        top: 0;
        left: 0;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        z-index: 10000;
        pointer-events: none;
      }
      .cursor-dot {
        width: 8px;
        height: 8px;
        background-color: white;
      }
      .cursor-outline {
        width: 40px;
        height: 40px;
        border: 1px solid rgba(255, 255, 255, 0.5);
        transition: width 0.2s, height 0.2s, background-color 0.2s;
      }
      
      body:hover .cursor-outline {
        width: 40px;
        height: 40px;
      }

      /* --- Scroll Animations --- */
      
      /* Base Class for Reveal */
      .reveal-on-scroll {
        opacity: 0;
        transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
        will-change: opacity, transform;
      }

      /* Fade Up */
      .reveal-on-scroll.fade-up {
        transform: translateY(40px);
      }
      .reveal-on-scroll.fade-up.is-visible {
        opacity: 1;
        transform: translateY(0);
      }

      /* Slide Side (Left/Right based on Direction) */
      html[dir="ltr"] .reveal-on-scroll.slide-in-right { transform: translateX(50px); }
      html[dir="rtl"] .reveal-on-scroll.slide-in-right { transform: translateX(-50px); }
      
      html[dir="ltr"] .reveal-on-scroll.slide-in-left { transform: translateX(-50px); }
      html[dir="rtl"] .reveal-on-scroll.slide-in-left { transform: translateX(50px); }

      .reveal-on-scroll.slide-in-right.is-visible,
      .reveal-on-scroll.slide-in-left.is-visible {
        opacity: 1;
        transform: translateX(0);
      }

      /* Zoom In */
      .reveal-on-scroll.zoom-in {
        transform: scale(0.95);
      }
      .reveal-on-scroll.zoom-in.is-visible {
        opacity: 1;
        transform: scale(1);
      }

      /* Stagger Delays */
      .delay-100 { transition-delay: 100ms; }
      .delay-200 { transition-delay: 200ms; }
      .delay-300 { transition-delay: 300ms; }
      .delay-500 { transition-delay: 500ms; }

      /* --- End Scroll Animations --- */
      
      /* Animations for Hero Section - CRITICAL FIX */
      @keyframes fade-in-up {
        0% { opacity: 0; transform: translateY(20px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      
      @keyframes fade-in-down {
        0% { opacity: 0; transform: translateY(-20px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      
      /* Toast Slide In */
      @keyframes slide-in-bottom {
        0% { transform: translateY(100%); opacity: 0; }
        100% { transform: translateY(0); opacity: 1; }
      }

      .animate-fade-in-up {
        animation: fade-in-up 0.8s ease-out forwards;
      }
      
      .animate-fade-in-down {
        animation: fade-in-down 0.5s ease-out forwards;
      }
      
      .animate-slide-in-bottom {
        animation: slide-in-bottom 0.5s ease-out forwards;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        background: #09090b;
      }
      ::-webkit-scrollbar-thumb {
        background: #3f3f46; 
        border-radius: 4px;
      }

      @media (max-width: 768px) {
        .cursor-dot, .cursor-outline {
          display: none;
        }
        body {
            cursor: auto;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.32.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0"
  }
}
</script>
</head>
  <body class="bg-black text-zinc-100 antialiased selection:bg-indigo-500/30 selection:text-white">
    <div id="cursor-dot" class="cursor-dot"></div>
    <div id="cursor-outline" class="cursor-outline"></div>
    
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
    <script>
        // Cursor Logic
        const cursorDot = document.getElementById("cursor-dot");
        const cursorOutline = document.getElementById("cursor-outline");

        window.addEventListener("mousemove", (e) => {
            const posX = e.clientX;
            const posY = e.clientY;

            cursorDot.style.left = `${posX}px`;
            cursorDot.style.top = `${posY}px`;

            cursorOutline.animate({
                left: `${posX}px`,
                top: `${posY}px`
            }, { duration: 500, fill: "forwards" });
        });

        // Advanced Scroll Reveal Logic
        document.addEventListener('DOMContentLoaded', () => {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-visible');
                    }
                });
            }, {
                threshold: 0.15, // Trigger when 15% visible
                rootMargin: "0px 0px -50px 0px" // Trigger slightly before bottom
            });

            // Target elements added by React
            const checkForElements = setInterval(() => {
                const elements = document.querySelectorAll('.reveal-on-scroll:not(.observed)');
                elements.forEach(el => {
                    observer.observe(el);
                    el.classList.add('observed');
                });
            }, 500);
        });
    </script>
  </body>
</html>
